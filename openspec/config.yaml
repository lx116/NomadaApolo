# OpenSpec / SDD project configuration — NomadaApolo
# Generated by sdd-init on 2026-08-13. Do NOT edit by hand unless changing
# project-wide SDD rules. SDD phases read this file at the start of each run.

schema: spec-driven

context: |
  Tech stack:
    - Python >=3.10 (runtime .venv reports 3.14)
    - Django scaffold (nomadaapolo/ project, sqlite default, no app code yet)
    - transcriptor/ package: audio validation, FFmpeg normalization, faster-whisper transcription
    - faster-whisper>=1.2.1 (runtime dep), ffmpeg/ffprobe (system binaries)
    - pathlib, argparse, json stdlib for CLI/IO
  Architecture:
    - Layered: transcriptor/ (engine) decoupled from nomadaapolo/ (Django scaffold)
    - Slice delivery: Slice 1 (validation), Slice 2 (FFmpeg), Slice 3a (transcription), Slice 3b (real-model integration test) shipped per README
    - Not yet implemented: audio-chunk pipeline (specs/audio-chunck/), Celery, API, exporters, Django integration, Yurbaco.m4a processing
  Testing:
    - Runner: pytest>=8.0 (.venv/bin/pytest), testpaths=["tests"]
    - Layers: contract (mocked, no FFmpeg required), integration (ffprobe/ffmpeg gated), real-model (faster-whisper tiny, offline, shape-only, deterministically skipped when model missing)
    - Coverage: none configured (no .coveragerc / --cov in pyproject.toml)
  Style:
    - Ponytail minimal-solution ladder active at 'full' level
    - Technical artifacts, config, comments, and code in English
    - Source-immutability invariant: originals never modified/deleted
    - Deterministic error mapping (AudioProbeError, NormalizationError, TranscriptionError)
  Existing product specs (preserved, NOT managed by OpenSpec):
    - specs/audio-chunck/  (00..07, proposed audio-chunk pipeline, Spanish)
    - specs/sdd_00_indice.md, specs/sdd_fase1_motor_transcripcion.md (roadmap + Phase 1 SDD)

rules:
  proposal:
    - Include a rollback plan for risky changes
    - State which existing product spec (specs/audio-chunck/*) the change implements or extends
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Reference AC-* requirement IDs from specs/audio-chunck/00_indice.md when applicable
  design:
    - Document architecture decisions with rationale
    - Preserve source-immutability invariant explicitly
    - Keep transcriptor/ decoupled from Django scaffold
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep each task completable in one session
    - Honor the 400 changed-line review budget per delivery slice
  apply:
    guidelines:
      - Follow existing code patterns in transcriptor/
      - Never modify or delete source audio files
      - Ponytail ladder: stdlib before new deps, native platform features before libs
      - Mark deliberate simplifications with `ponytail:` comments including the known ceiling / upgrade path
    tdd: true
    test_command: ".venv/bin/pytest"
  verify:
    test_command: ".venv/bin/pytest"
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - Preserve AC-* traceability when merging into main specs
